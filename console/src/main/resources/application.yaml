# 应用名称
spring:
  application:
    name: item
  profiles:
    active: dev # 默认激活开发环境
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 占用端口
server:
  port: 8081
  # tomcat线程池配置
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20000

logging:
  level:
    # root：全局所有包默认级别
    root: INFO
